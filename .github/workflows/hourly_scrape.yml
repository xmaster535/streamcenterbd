name: Hourly Stream Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install aiohttp selectolax

    - name: Run Scraper
      run: |
        python -c "import asyncio; from streamcenter import scrape; asyncio.run(scrape())"

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add strmcntr_cache.json
        git commit -m "Auto Update: $(date)" || echo "No changes to commit"
        git push
