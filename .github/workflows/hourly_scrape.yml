name: Hourly Stream Update

on:
  schedule:
    - cron: '*/15 * * * *' # ব্যাকআপ হিসেবে প্রতি ১৫ মিনিট পর পর চেক করবে
  workflow_dispatch: # ম্যানুয়াল রান করার জন্য
  repository_dispatch:
    types: [site_updated] # এই নামের ইভেন্ট আসলেই সাথে সাথে রান হবে

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp selectolax

    - name: Run Scraper
      run: |
        python -c "import asyncio; from streamcenter import scrape; asyncio.run(scrape())"

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add strmcntr_cache.json
        git commit -m "Auto Update: $(date)" || echo "No changes to commit"
        git push
